[project]
name = "hindu-epaper-mcp"
version = "0.2.0"
description = "MCP server for reading your The Hindu ePaper (epaper.thehindu.com) subscription"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27",
    "playwright>=1.44",
    "pypdf>=4.2",
    "uvicorn>=0.30",
    "websockets>=12",
]

[project.scripts]
hindu-epaper-mcp = "hindu_epaper_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hindu_epaper_mcp"]
